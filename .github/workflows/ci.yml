name: CI - Build and Test

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    name: Build Project
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '24'
        cache: 'npm'
        cache-dependency-path: frontend/package-lock.json

    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install build setuptools wheel

    - name: Install frontend dependencies
      run: |
        cd frontend
        npm ci

    - name: Build frontend
      run: |
        cd frontend
        npm run build

    - name: Copy frontend assets to package
      run: |
        mkdir -p label_tool/frontend_dist
        cp -r frontend/dist/* label_tool/frontend_dist/

    - name: Build Python wheel
      run: python -m build --wheel

    - name: Verify wheel
      run: |
        ls -lh dist/*.whl
        python -m zipfile -l dist/*.whl | head -20

    - name: Upload wheel artifact
      uses: actions/upload-artifact@v4
      with:
        name: logist-labeling-wheel
        path: dist/*.whl
        retention-days: 7

  test-install:
    name: Test Installation
    runs-on: ubuntu-latest
    needs: build
    
    steps:
    - name: Download wheel artifact
      uses: actions/download-artifact@v4
      with:
        name: logist-labeling-wheel

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install wheel
      run: pip install *.whl

    - name: Verify installation
      run: |
        pip show logist-labeling
        python -c "import label_tool; print('Import successful')"

    - name: Test CLI
      run: |
        logist-labeling --help
        logist-labeling start --help
